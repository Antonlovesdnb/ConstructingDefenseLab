- name: role_splunk_collector_linuxv v1.4.0
  debug:
    msg: "Running role_splunk_collector_linuxv version 1.4.0 - direct config writes instead of CLI"

- name: Update packages
  ansible.builtin.shell:
    cmd: apt-get -y update
- name: Install Curl
  ansible.builtin.shell:
    cmd: apt-get install -y curl
- name: Make Splunk Directory
  ansible.builtin.shell:
    cmd: mkdir -p /opt/splunkforwarder
- name: Download Splunk Forwarder
  ansible.builtin.shell:
    cmd: wget -O /opt/splunkforwarder/splunk.deb "https://download.splunk.com/products/universalforwarder/releases/10.0.1/linux/splunkforwarder-10.0.1-c486717c322b-linux-amd64.deb"
- name: Add Splunk User
  ansible.builtin.user:
    name: splunkfwd
    create_home: yes
    state: present
- name: Install Splunk Forwarder
  ansible.builtin.shell:
    cmd: dpkg -i /opt/splunkforwarder/splunk.deb
- name: Update Permissions
  ansible.builtin.shell:
    cmd: chown -R splunkfwd:splunkfwd /opt/splunkforwarder
- name: Derive DC IP from local network (DC is at .11 in same /24)
  set_fact:
    dc_forward_ip: "{{ ansible_default_ipv4.address.split('.')[0:3] | join('.') + '.11' }}"
- name: Ensure Splunk local config directory exists
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/system/local
    state: directory
    owner: splunkfwd
    group: splunkfwd
    mode: '0755'
  become: yes
- name: Configure forward server via outputs.conf
  ansible.builtin.copy:
    content: |
      [tcpout]
      defaultGroup = default-autolb-group

      [tcpout:default-autolb-group]
      server = {{ dc_forward_ip }}:9997
    dest: /opt/splunkforwarder/etc/system/local/outputs.conf
    owner: splunkfwd
    group: splunkfwd
    mode: '0644'
  become: yes
- name: Configure Laurel audit log monitor via inputs.conf
  ansible.builtin.copy:
    content: |
      [monitor:///var/log/laurel/audit.log]
      disabled = 0
      index = linux
    dest: /opt/splunkforwarder/etc/system/local/inputs.conf
    owner: splunkfwd
    group: splunkfwd
    mode: '0644'
  become: yes
- name: Enable Splunk forwarder boot-start via systemd
  ansible.builtin.shell:
    cmd: /opt/splunkforwarder/bin/splunk enable boot-start -systemd-managed 1 -user splunkfwd --accept-license --answer-yes --no-prompt
  failed_when: false
- name: Start Splunk via systemd
  ansible.builtin.systemd:
    name: SplunkForwarder
    state: started
    enabled: yes
  register: splunk_start_result
  failed_when: false
- name: Fallback start if systemd unit not present
  ansible.builtin.shell:
    cmd: /opt/splunkforwarder/bin/splunk start --accept-license --answer-yes --no-prompt
  when: splunk_start_result.failed | default(false)
  failed_when: false