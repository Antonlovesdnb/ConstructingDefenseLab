- name: role_splunk_install v1.1.0
  debug:
    msg: "Running role_splunk_install version 1.1.0"

- name: Run PowerShell Script to Deploy Splunk Server to DC.condef.local
  ansible.windows.win_powershell:
    script: |
      Write-Host "Creating Directory..."

      New-Item -Path C:\ -Name SplunkFiles -ItemType Directory -Force | Out-Null

      Write-Host "Downloading Splunk..."

      Invoke-WebRequest -UseBasicParsing https://download.splunk.com/products/splunk/releases/10.0.1/windows/splunk-10.0.1-c486717c322b-windows-x64.msi -OutFile C:\SplunkFiles\splunk.msi

      Write-Host "Downloading Splunk Apps..."

      Invoke-WebRequest -UseBasicParsing https://github.com/Antonlovesdnb/ConstructingDefenseLab/raw/refs/heads/main/files/splunkappsdc.zip -OutFile C:\SplunkFiles\splunkappsdc.zip

      Write-Host "Starting Splunk Install..."

      Start-Process msiexec.exe -ArgumentList '/I C:\SplunkFiles\splunk.msi AGREETOLICENSE=Yes SPLUNKUSERNAME=Condef SPlUNKPASSWORD=Temp1234!! /quiet' -PassThru -Wait

      Write-Host "Waiting for splunkd service to be ready..."
      $timeout = 60
      while ($timeout -gt 0) {
        $svc = Get-Service splunkd -ErrorAction SilentlyContinue
        if ($svc -and $svc.Status -eq "Running") { break }
        Start-Sleep -Seconds 2
        $timeout -= 2
      }

      Write-Host "Creating Indexes..."

      $indexes = @("winlogs", "sysmon", "linux", "azure", "aws", "kube", "etw")
      foreach ($idx in $indexes) {
        Write-Host "  - adding index: $idx"
        Start-Process "C:\Program Files\Splunk\bin\splunk.exe" -ArgumentList "add index $idx -auth condef:Temp1234!!" -Wait -NoNewWindow
      }

      Write-Host "Enabling Listener..."

      Start-Process "C:\Program Files\Splunk\bin\splunk.exe" -ArgumentList "enable listen 9997 -auth condef:Temp1234!!" -Wait -NoNewWindow

      Write-Host "Configuring Apps..."

      Expand-Archive -LiteralPath C:\SplunkFiles\splunkappsdc.zip -DestinationPath 'C:\Program Files\Splunk\etc\apps\' -Force

      Restart-Service -Name splunkd

      Write-Host "Waiting for splunkd to come back online..."
      $timeout = 60
      while ($timeout -gt 0) {
        $svc = Get-Service splunkd -ErrorAction SilentlyContinue
        if ($svc -and $svc.Status -eq "Running") { break }
        Start-Sleep -Seconds 2
        $timeout -= 2
      }

      Write-Host "Disabling Firewall"

      Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False