- name: Run PowerShell Script to Deploy Splunk Forwarder to CERTER.condef.local
  ansible.windows.win_powershell:
    script: |
      Write-Host "Creating Directory..."

      New-Item -Path C:\ -Name SplunkFiles -ItemType Directory

      Write-Host "Downloading Splunk Forwarder..."

      Invoke-WebRequest -UseBasicParsing "https://download.splunk.com/products/universalforwarder/releases/10.0.1/windows/splunkforwarder-10.0.1-c486717c322b-windows-x64.msi" -OutFile C:\SplunkFiles\forwarder.msi

      Write-Host "Downloading Windows TA App..."

      Invoke-WebRequest -UseBasicParsing "https://github.com/Antonlovesdnb/ConstructingDefenseLab/raw/refs/heads/main/files/splunkappscerter.zip" -OutFile C:\SplunkFiles\splunkappscerter.zip

      Write-Host "Deriving DC IP from local network..."

      $localIP = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -like "10.*" -and $_.InterfaceAlias -notlike "*Loopback*" } | Select-Object -First 1).IPAddress
      $parts = $localIP.Split('.')
      $dcIP = "$($parts[0]).$($parts[1]).$($parts[2]).11"
      Write-Host "Derived DC IP: $dcIP"

      Write-Host "Installing Forwarder..."

      $msiArgs = "/I C:\SplunkFiles\forwarder.msi AGREETOLICENSE=Yes SPLUNKUSERNAME=Condef SPlUNKPASSWORD=Temp1234!! RECEIVING_INDEXER=`"${dcIP}:9997`" /quiet"
      Start-Process msiexec.exe -ArgumentList $msiArgs -PassThru -Wait

      Write-Host "Installing Windows TA App.."

      Expand-Archive -LiteralPath C:\SplunkFiles\splunkappscerter.zip -DestinationPath 'C:\Program Files\SplunkUniversalForwarder\etc\apps'

      Start-Process sc.exe -ArgumentList 'config "splunkforwarder" obj="Localsystem"'

      Write-Host "Restarting Splunk Forwarder"

      Restart-Service SplunkForwarder

      Write-Host "Disabling Firewall"

      Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
